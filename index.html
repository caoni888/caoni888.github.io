<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт на GitHub Pages</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            margin-top: 0;
            color: #24292e;
        }
        p {
            line-height: 1.5;
            color: #586069;
        }
        .btn {
            display: inline-block;
            margin-top: 1.2rem;
            padding: 0.7rem 1.4rem;
            background-color: #2ea44f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Привет, мир! 👋</h1>
        <p>Это мой первый сайт, запущенный бесплатно на GitHub Pages.</p>
        <a href="https://github.com" class="btn" target="_blank">Мой профиль на GitHub</a>
    </div>

</body>
</html>
